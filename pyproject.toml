[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpd-benchmark"
version = "0.1.0"
description = "Benchmark of classical features, metaheuristic search, and small neural baselines for fake-profile detection"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "scikit-image>=0.24",
  "opencv-python-headless>=4.10",
  "optuna>=4.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "psutil>=6.0",
  "joblib>=1.4",
  "pillow>=10.0",
  "huggingface-hub>=0.26",
]

[project.optional-dependencies]
gpu = ["cuml-cu12>=24.10", "cupy-cuda12x>=13.0", "nvidia-ml-py>=12.0"]
cnn = ["torch>=2.4"]
dev = ["pytest>=8.0", "ruff>=0.7"]

[project.scripts]
fpd = "fpd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B023", "SIM103"]
